<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuackSQL | DuckDB Manager</title>
    <link rel="stylesheet" href="style.css?v=tree_v1">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🦆 QuackSQL</div>
            </div>
            
            <div class="sidebar-section">
                <div class="section-header">
                    <h3>DATABASE</h3>
                </div>
                <div class="search-box">
                    <input type="text" id="schema-search" placeholder="Search tables...">
                </div>
                <div id="schema-tree" class="sidebar-list">
                    <div class="loading">Discovering views...</div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="query-actions">
                    <button id="run-query" class="btn btn-primary">
                        <span class="icon">▶</span> Run Query
                    </button>
                </div>
                <div id="status-bar" class="status-bar">Initializing...</div>
            </header>

            <div class="tab-system">
                <div class="editor-tabs" id="tab-bar">
                    <!-- Tabs and + button injected here by JS -->
                </div>
            </div>
            
            <section class="editor-section">
                <div id="sql-editor" class="editor-container"></div>
            </section>

            <section class="results-section">
                <div class="results-header">
                    <h2>Results</h2>
                    <div id="results-count"></div>
                </div>
                <div class="results-container" id="results-container">
                    <div class="empty-state">
                        <p>No results yet. Write a query and hit Run!</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Local CodeMirror Bundle -->
    <script src="editor-bundle.js"></script>
    <script type="module" src="editor.js?v=tabs_final_v9"></script>
</body>
</html>
